RTL_FLST     : $TB_DIR/filelist/shm_dut.f
TB_FLST      : $TB_DIR/filelist/shm_environment.f
TB_FLST      : $TB_DIR/filelist/shm_tbtop.f

TB_TOP_NAME  : shm_tb_top

RTL_ANA_OPT  : -assert svaext +define+RHC_ASSERT_ON

TB_ANA_OPT   : +define+SVT_UVM_TECHNOLOGY +define+SYNOPSYS_SV

TB_ELAB_OPT  : -debug_access+all +lint=TFIPC-L
TB_ELAB_OPT  : -cpp g++ -cc gcc -LDFLAGS -Wl,--no-as-needed
TB_ELAB_OPT  : +notimingchecks +nospecify
TB_ELAB_OPT  : shm_tb_top shm_test_package

TB_CMP_OPT   : +define+SVT_UVM_TECHNOLOGY +define+SYNOPSYS_SV +define+RHC_ASSERT_ON
TB_CMP_OPT   : -debug_access+all +lint=TFIPC-L
TB_CMP_OPT   : -cpp g++ -cc gcc -LDFLAGS -Wl,--no-as-needed
TB_CMP_OPT   : +notimingchecks +nospecify
TB_CMP_OPT   : -top shm_tb_top

TB_COV_OPT   : -cm line+cond+fsm+branch+tgl

PRE_CMP_CMD  :
PST_CMP_CMD  :